<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMANIS Sync - Supabase Realtime</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Tombol untuk Membuka Modal Pengaturan Sinkronisasi -->
    <button onclick="toggleModal(true)" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl font-medium shadow-lg transition">
        ☁️ Pengaturan Sinkronisasi Antar HP
    </button>

    <!-- Status Koneksi -->
    <div id="status-badge" class="mt-4 text-sm px-3 py-1 rounded-full bg-red-900/50 text-red-300 border border-red-700">
        Status: Belum Terhubung
    </div>

    <!-- MODAL SESUAI GAMBAR -->
    <div id="sync-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl relative text-slate-200">
            
            <!-- Tombol Tutup (X) -->
            <button onclick="toggleModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">&times;</button>

            <!-- Judul & Deskripsi -->
            <div class="flex items-center gap-2 mb-2">
                <span class="text-2xl">☁️</span>
                <h2 class="text-xl font-bold text-white">Sinkronisasi Antar HP</h2>
            </div>
            <p class="text-sm text-slate-400 mb-5 leading-relaxed">
                Perawat, dokter, dan pasien membuka papan yang sama di HP berbeda. Gunakan <strong>Kode Papan</strong> yang sama di semua HP (contoh: <code>melati-bed3</code>).
            </p>

            <!-- Form Input -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Supabase Project URL</label>
                    <input type="text" id="sb-url" placeholder="https://xxx.supabase.co" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Anon (public) key</label>
                    <input type="password" id="sb-key" placeholder="eyJhbGciOi..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Kode Papan (unik untuk ruangan/pasien)</label>
                    <input type="text" id="sb-board" placeholder="misal: melati-bed3" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="mt-6 space-y-2.5">
                <button onclick="saveAndConnect()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl shadow-md transition">
                    Simpan & Hubungkan
                </button>
                <button onclick="resetConnection()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium py-3 rounded-xl transition">
                    Putuskan / Reset
                </button>
            </div>

        </div>
    </div>

    <!-- Script Logika Sinkronisasi -->
    <script>
        let supabaseClient = null;
        let channelRealtime = null;

        // Load konfigurasi tersimpan saat halaman dibuka
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('simanis_sb_url');
            const savedKey = localStorage.getItem('simanis_sb_key');
            const savedBoard = localStorage.getItem('simanis_sb_board');

            if (savedUrl) document.getElementById('sb-url').value = savedUrl;
            if (savedKey) document.getElementById('sb-key').value = savedKey;
            if (savedBoard) document.getElementById('sb-board').value = savedBoard;

            if (savedUrl && savedKey && savedBoard) {
                initSupabase(savedUrl, savedKey, savedBoard);
            }
        });

        function toggleModal(show) {
            const modal = document.getElementById('sync-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function saveAndConnect() {
            const url = document.getElementById('sb-url').value.trim();
            const key = document.getElementById('sb-key').value.trim();
            const board = document.getElementById('sb-board').value.trim();

            if (!url || !key || !board) {
                alert('Mohon isi Project URL, Anon Key, dan Kode Papan secara lengkap!');
                return;
            }

            localStorage.setItem('simanis_sb_url', url);
            localStorage.setItem('simanis_sb_key', key);
            localStorage.setItem('simanis_sb_board', board);

            initSupabase(url, key, board);
            toggleModal(false);
        }

        function resetConnection() {
            localStorage.removeItem('simanis_sb_url');
            localStorage.removeItem('simanis_sb_key');
            localStorage.removeItem('simanis_sb_board');
            
            document.getElementById('sb-url').value = '';
            document.getElementById('sb-key').value = '';
            document.getElementById('sb-board').value = '';

            if (channelRealtime && supabaseClient) {
                supabaseClient.removeChannel(channelRealtime);
            }
            
            updateStatus('Terputus', 'bg-red-900/50 text-red-300 border-red-700');
            toggleModal(false);
        }

        function updateStatus(text, className) {
            const badge = document.getElementById('status-badge');
            badge.className = `mt-4 text-sm px-3 py-1 rounded-full border ${className}`;
            badge.innerText = `Status: ${text}`;
        }

        async function initSupabase(url, key, boardCode) {
            try {
                supabaseClient = supabase.createClient(url, key);
                updateStatus('Menghubungkan...', 'bg-yellow-900/50 text-yellow-300 border-yellow-700');

                // Cek atau buat data awal papan
                let { data, error } = await supabaseClient
                    .from('simanis_sync')
                    .select('*')
                    .eq('board_code', boardCode)
                    .single();

                if (!data) {
                    await supabaseClient.from('simanis_sync').insert([{ board_code: boardCode, data: {} }]);
                }

                updateStatus(`Terhubung (Papan: ${boardCode})`, 'bg-emerald-900/50 text-emerald-300 border-emerald-700');

                // Dengarkan perubahan real-time dari HP lain
                if (channelRealtime) supabaseClient.removeChannel(channelRealtime);

                channelRealtime = supabaseClient
                    .channel(`room-${boardCode}`)
                    .on('postgres_changes', { 
                        event: 'UPDATE', 
                        schema: 'public', 
                        table: 'simanis_sync',
                        filter: `board_code=eq.${boardCode}`
                    }, (payload) => {
                        console.log('Data sinkron diterima dari HP lain:', payload.new.data);
                        // Jalankan fungsi update tampilan web app Anda di sini
                        handleIncomingData(payload.new.data);
                    })
                    .subscribe();

            } catch (err) {
                console.error(err);
                updateStatus('Gagal Terhubung (Cek URL/Key)', 'bg-red-900/50 text-red-300 border-red-700');
            }
        }

        // Contoh fungsi mengirim data ke Supabase saat perawat/pasien mengubah input
        async function sendDataToCloud(newData) {
            if (!supabaseClient) return;
            const boardCode = localStorage.getItem('simanis_sb_board');

            const { error } = await supabaseClient
                .from('simanis_sync')
                .update({ data: newData, updated_at: new Date() })
                .eq('board_code', boardCode);

            if (error) console.error('Gagal menyinkronkan:', error);
        }

        function handleIncomingData(data) {
            // Tulis logika untuk memperbarui elemen di UI web app Anda berdasarkan data terbaru
            alert('Ada pembaruan data secara real-time dari HP lain!');
        }
    </script>
</body>
</html>
